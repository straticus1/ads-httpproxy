# A strictly supported, DNS-free forward proxy ACL set.
http_port 127.0.0.1:3128
acl localnet src 10.0.0.0/8
acl localnet src 2001:db8::/32 192.168.1.4
acl safe port 80 443 8000-8010
acl tls port 443
acl tunnel method CONNECT
acl read method GET HEAD
acl sites dstdomain -n .example.com exact.test
http_access deny !safe
http_access deny tunnel !tls
http_access allow localnet sites read
http_access allow localnet sites tunnel
http_access deny all

# Local-only platform demonstration. See docs/enterprise-platform.md.
# Supply a fresh administrative secret through ADS_API_SECRET.
addr: "127.0.0.1:8080"
api_addr: "127.0.0.1:9090"
api_secret: ""
socks_addr: ""
features:
  forward_proxy: true
  reverse_proxy: false
  browser_id: false
  masque: false
auth:
  mechanism: none
  allow_unauthenticated: true
  allowed_source_nets: ["127.0.0.0/8", "::1/128"]
access:
  enabled: true
  require_identity: false
  default_effect: allow
analysis:
  enabled: true
  workers: 2
  queue_capacity: 256
  sample_rate: 1
  per_tenant_per_minute: 1000
  max_tenants: 1024
  capture_bodies: false
  max_body_bytes: 4096
  findings_capacity: 1000
  finding_ttl_seconds: 3600
  max_retries: 1
  journal_path: ./platform-findings.jsonl
  journal_max_bytes: 10485760
adaptive:
  enabled: true
  mode: shadow
  state_file: ./platform-policy.json
  rules: []
ai:
  enabled: true
  # No provider_url: explanations use the local deterministic implementation.
  # Enable egress controls with your approved hosts/models using the guide.
  egress:
    enabled: false

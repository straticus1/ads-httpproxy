# Local developer toolkit. See docs/developer-toolkit.md.
addr: "127.0.0.1:8080"
api_addr: "127.0.0.1:9090"
api_secret: "local-development-key"
features:
  forward_proxy: true
  reverse_proxy: true
  browser_id: false
  masque: false
auth:
  mechanism: none
  allow_unauthenticated: true
  allowed_source_nets: ["127.0.0.0/8", "::1/128"]
devtools:
  enabled: true
  capacity: 500
  capture_bodies: false
  max_body_bytes: 4096
  rules: []
# Persistent interception CA (otherwise an ephemeral per-instance CA is used):
# ca_cert: ./ca.crt
# ca_key: ./ca.key
# HTTP/HTTPS parent for outbound requests:
# parent_proxy: http://parent.example.com:3128
# HTTP/3 gateway; supply a certificate covering the gateway hostname:
# enable_quic: true
# quic_cert: ./gateway.crt
# quic_key: ./gateway.key
# HTTP/3 upstreams (cannot be used with an HTTP parent proxy):
# quic_upstreams: ["api.example.com:443"]
# Opaque QUIC/UDP relay to one fixed origin:
# quic_relay:
#   addr: "127.0.0.1:8443"
#   target: "quic-origin.example.com:443"
#   max_clients: 256
#   idle_timeout_seconds: 60
